<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GrowFit Band - Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .login-container { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); width: 100%; max-width: 400px; transition: transform 0.3s ease; }
        .login-container:hover { transform: translateY(-5px); }
        h1 { color: #667eea; text-align: center; margin-bottom: 10px; font-size: 32px; }
        .subtitle { text-align: center; color: #666; margin-bottom: 30px; font-size: 14px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #555; font-weight: 500; }
        input { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 16px; transition: border-color 0.3s, box-shadow 0.3s; }
        input:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,0.2); }
        .btn { width: 100%; padding: 14px; background: #667eea; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: 600; cursor: pointer; transition: background 0.3s, transform 0.1s; }
        .btn:hover { background: #5568d3; }
        .btn:active { transform: scale(0.98); }
        .signup-link { text-align: center; margin-top: 20px; color: #666; }
        .signup-link a { color: #667eea; text-decoration: none; font-weight: 600; }
        .signup-link a:hover { text-decoration: underline; }
        .error-message { background: #f8d7da; color: #721c24; padding: 10px; border-radius: 8px; margin-bottom: 20px; text-align: center; font-size: 14px; display: none; }
        @media (max-width: 480px) { .login-container { padding: 30px 20px; } h1 { font-size: 28px; } }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>🏃 GrowFit Band</h1>
        <div class="subtitle">Track your health journey</div>
        <div class="error-message" id="errorMessage"></div>
        <form method="POST" action="/login" id="loginForm">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" id="username" required autocomplete="username">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" id="password" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn">Login</button>
        </form>
        <div class="signup-link">Don't have an account? <a href="/signup">Sign up</a></div>
    </div>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const error = urlParams.get('error');
        if (error) {
            document.getElementById('errorMessage').textContent = decodeURIComponent(error);
            document.getElementById('errorMessage').style.display = 'block';
        }
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            if (!document.getElementById('username').value.trim() || !document.getElementById('password').value) {
                e.preventDefault();
                const errDiv = document.getElementById('errorMessage');
                errDiv.textContent = 'Please fill in both fields.';
                errDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
